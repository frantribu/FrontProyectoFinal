<section class="card-usuario">
    <div class="card-header">
        <div>
            <h2>{{ client()?.nombre }} {{ client()?.apellido }}</h2>
            <span>Telefono: {{client()?.telefono}}</span>
        </div>

        <span class="estado-usuario" [class]="client()?.activo ? 'activo' : 'inactivo'">{{client()?.activo ? 'Activo' :
            'Inactivo'}}</span>
    </div>

    <hr>

    <div class="card-footer">
        <div>
            @if (authService.isAdmin()) {
            <button [class]="client()?.activo ? 'desactivar' : 'activar'" (click)="toggleEstadoUsuario(client()!.id)">
                {{ client()?.activo ? 'Desactivar' : 'Reactivar' }}
            </button>
            }
            <button (click)="modificarCliente()">
                <span class="material-symbols-outlined">
                    edit
                </span>
            </button>
        </div>
    </div>

</section>
