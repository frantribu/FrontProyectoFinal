<section>
    <div class="perfil-header">
        <div class = "avatar-perfil-container">
            <div class="avatar-container">
                <p class="avatar-iniciales">{{getIniciales()}}</p>
            </div>
            <div class="perfil-info">
                <h1>{{userSignal()?.nombre}} {{userSignal()?.apellido}}</h1>
                <p class="perfil-rol">{{authService.getRol()}}</p>
            </div>
        </div>

        <div class="modificar_perfil">
            <button (click)="modificarPerfil()">Modificar Perfil</button>
        </div>
    </div>

    <div class="perfil-card">
        <div class="card-header">
            <span class="material-symbols-outlined">person</span>
            <h2>Información personal</h2>
        </div>

        <div class="perfil-detalle">
            <div class="detalle-item">
                <span class="detalle-label">Nombre</span>
                <span class="detalle-value nombre">{{userSignal()?.nombre ?? ' '}}</span>
            </div>

            <div class="detalle-item">
                <span class="detalle-label">Apellido</span>
                <span class="detalle-value nombre">{{userSignal()?.apellido ?? ''}}</span>
            </div>

            <div class="detalle-item">
                <span class="detalle-label">Email</span>
                <span class="detalle-value">{{userSignal()?.email}}</span>
            </div>

            <div class="detalle-item">
                <span class="detalle-label">DNI</span>
                <span class="detalle-value">{{userSignal()?.dni}}</span>
            </div>

            <div class="detalle-item">
                <span class="detalle-label">Rol</span>
                <span class="detalle-value">{{userSignal()?.rol}}</span>
            </div>
        </div>
    </div>
