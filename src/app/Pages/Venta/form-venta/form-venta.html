<div>
    <form [formGroup]="form">
        <div class="container-input">
            <label for="vehiculo">Vehiculo</label>
            <input readonly [value]="vehiculo()?.marca + ' ' + vehiculo()?.modelo + ' ' + vehiculo()?.version">
        </div>

        <div class="container-input">
            <label for="cliente">Cliente</label>
            <select formControlName="clienteId">
                <option value="">Selecciona un cliente</option>
                @for (cli of clientes(); track cli.id) {
                <option [value]="cli.id">{{cli.nombre}} {{cli.apellido}} - {{cli.dni}}</option>
                }
            </select>
        </div>

        <div class="container-input">
            <label for="precio">Precio</label>
            <input [value]="vehiculo()?.precioVenta" type="number" formControlName="precioVenta">
        </div>

        <button (click)="agregarVenta()">
            Vender vehiculo
        </button>
    </form>
</div>
