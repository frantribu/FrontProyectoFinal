
<div class="container-moto-form" >
    <form [formGroup]="form" (submit)="onSubmit()">

        <div class="container-select">
            <label for="marca">Marca</label>
            <select formControlName="marca" (change)="onMarcaChange()">
                <option value="">Selecciona una marca</option>
                @for (m of marcas(); track m) {
                <option [value]="m">{{m}}</option>
                }
            </select>
        </div>

        <div class="container-select">
            <label for="modelo">Modelo</label>
            <select formControlName="modelo">
                <option value="">Selecciona un modelo</option>
                @for (mod of modelos(); track mod) {
                <option [value]="mod">{{mod}}</option>
                }
            </select>
        </div>

        <div class="container-input">
            <label for="anio-input">Año</label>
            <input type="number" id="anio-input" placeholder="" formControlName="anio">
        </div>

        <div class="container-input">
            <label for="version-input">Versión</label>
            <input type="text" id="version-input" placeholder="" formControlName="version">
        </div>

        <div class="container-input">
            <label for="tipo-moto-input">Tipo de Moto</label>
            <select formControlName="tipoMoto">
                <option value="">Selecciona un tipo de moto</option>
                @for (t of tiposMoto(); track t.name) {
                    <option [value]="t.name">{{t.label}}</option>
                }
            </select>
        </div>

        <div class="container-input">
            <label for="cilindrada-input">Cilindrada (cc)</label>
            <input type="number" id="cilindrada-input" placeholder="" formControlName="cilindrada">
        </div>

        <div class="container-input">
            <label for="motor-input">Tipo de motor</label>
            <input type="text" id="combustible-input" placeholder="" formControlName="motor">
        </div>

        <div class="container-input">
            <label for="combustible-input">Tipo de combustible</label>
            <input type="text" id="combustible-input" placeholder="" formControlName="combustion">
        </div>

        <div class="container-input">
            <label for="precio-input">Precio</label>
            <input type="number" id="precio-input" placeholder="" formControlName="precio">
        </div>

        <div class="container-input">
            <label for="kilometraje-input">Kilometraje</label>
            <input type="number" id="kilometraje-input" placeholder="" formControlName="kilometraje">
        </div>

        <div class="container-input">
            <label for="patente-input">Patente</label>
            <input type="text" id="patente-input" placeholder="" formControlName="patente">
        </div>

        <div class="container-input">
            <label for="color-input">Color</label>
            <input type="text" id="color-input" placeholder="" formControlName="color">
        </div>

        <div class="container-input">
            <label for="descripcion-input">Descripcion</label>
            <input type="text" id="descripcion-input" placeholder="" formControlName="descripcion">
        </div>

        <app-image-upload></app-image-upload>

        <button type="submit" [disabled]="form.invalid">{{isEditable ? 'Actualizar moto' : 'Agregar moto'}}</button>
    </form>
</div>
