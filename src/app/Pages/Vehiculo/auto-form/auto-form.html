<div class="container-auto-form">
    <form [formGroup]="form" (submit)="agregarAuto()">
        <div class="container-select">
            <label for="marca-select">Marca</label>
            <select formControlName="marca" (change)="onMarcaChange()">
                <option value="">Selecciona una marca</option>
                @for (m of marcas(); track m) {
                <option [value]="m">{{m}}</option>
                }
            </select>
        </div>


        <div class="container-select">
            <label for="modelo-select">Modelo</label>
            <select formControlName="modelo" (change)="onModeloChange()">
                <option value="">Selecciona un modelo</option>
                @for (mod of modelos(); track mod) {
                <option [value]="mod">{{mod}}</option>
                }
            </select>
        </div>

        <div class="container-select">
            <label for="año-select">Año</label>
            <select formControlName="anio" (change)="onAnioChange()">
                <option [value]="0">Selecciona un año</option>
                @for (an of anios(); track an) {
                <option [value]="an">{{an}}</option>
                }
            </select>
        </div>

        <div class="container-select">
            <label for="submodelo-select">Version</label>
            <select formControlName="idTrim">
                <option value=0>Selecciona la version</option>
                @for (sub of submodelos(); track sub.id) {
                <option [value]="sub.id">{{sub.description}}</option>
                }

            </select>
        </div>

        <div class="container-input">
            <label for="precio-input">Precio</label>
            <input type="number" id="precio-input" placeholder="Precio" formControlName="precio">
        </div>

        <div class="container-input">
            <label for="kilometraje-input">Kilometraje</label>
            <input type="number" id="kilometraje-input" placeholder="" formControlName="kilometraje">
        </div>
        <div class="container-input">
            <label for="patente-input">Patente</label>
            <input type="text" id="patente-input" placeholder="ABC123" formControlName="patente">
        </div>
        <div class="container-input">
            <label for="color-input">Color</label>
            <input type="text" id="color-input" placeholder="" formControlName="color">
        </div>
        <app-image-upload></app-image-upload>
        <button type="submit" [disabled]="form.invalid">Agregar vehiculo</button>
    </form>
</div>
