<div class="container-usuarios">
    <div class="header-usuarios">

        <select (change)="onActivoChange($event)">
            <option value="">Todos</option>
            <option value="true">Activo</option>
            <option value="false">Inactivo</option>
        </select>
        
        <div class="add-user">
            <a routerLink="/users/nuevo">
                <span class="material-symbols-outlined">
                    add
                </span>
                Agregar Usuario</a>
        </div>

    </div>

    <div class="container-list-usuarios">
        @for (user of users(); track user.id) {
            <app-card-usuario [user]="user" (estadoModificado)="getUsers()"></app-card-usuario>
        }
    </div>
</div>
