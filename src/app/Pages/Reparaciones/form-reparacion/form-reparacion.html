<div class="container-moto-form" (submit)="agregarReparacion()">
    <form [formGroup]="form">

        <div class="container-select">
            <label for="taller-select">Taller</label>
            <select id="taller-select" formControlName="idTaller">
                <option value="">Selecciona un taller</option>
                @for (t of talleres(); track t.id) {
                    <option [value]="t.id">{{t.nombre}}</option>
                }
            </select>
        </div>

        <div class="container-select">
            <label for="vehiculo-select">Vehículo</label>
            <select id="vehiculo-select" formControlName="idVehiculo">
                <option value="">Selecciona un vehículo</option>
                @for (v of vehiculos(); track v.id) {
                    <option [value]="v.id">{{v.marca}} {{v.modelo}} - {{v.patente}}</option>
                }
            </select>
        </div>

        <div class="container-input">
            <label for="fecha-entrada-input">Fecha de Entrada</label>
            <input type="date" id="fecha-entrada-input" formControlName="fechaDeEntrada" readonly> //es mejor readonly porque se envia mejor, solo congela el campo y  se envia normal
        </div>

        <div class="container-input">
            <label for="fecha-salida-input">Fecha de Salida</label>
            <input type="date" id="fecha-salida-input" formControlName="fechaDeSalida">
        </div>

        <div class="container-input">
            <label for="descripcion-input">Descripción</label>
            <input type="text" id="descripcion-input" placeholder="Detalle de la reparación..." formControlName="descripcion">
        </div>

        <button type="submit" [disabled]="form.invalid">Agregar Reparación</button>
    </form>
</div>
