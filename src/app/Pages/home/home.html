<section>
    <div>
        <div class="resumen-header">
            <div class="container-title-section">
                <span class="material-symbols-outlined">
                    bar_chart_4_bars
                </span>
                <p class="title-section">Resumen del mes</p>
            </div>
            <a routerLink="">Ver reportes</a>
        </div>

        <div class="resumen-cards">
            <app-card-resumen icono="assignment" titulo="Facturacion" valor="$4.2M"></app-card-resumen>
            <app-card-resumen icono="toys" titulo="Ventas" valor="10"></app-card-resumen>
            <app-card-resumen icono="build" titulo="Reparaciones" valor="15"></app-card-resumen>
            <app-card-resumen icono="group" titulo="Clientes" valor="20"></app-card-resumen>
        </div>
    </div>

    <div>
        <div class="container-title-section">
            <span class="material-symbols-outlined">
                bolt
            </span>
            <p class="title-section">Accesos rapidos</p>
        </div>

        <div class="accesos-grid">
            <app-card-acceso-rapido class="card-acceso" logo="add" titulo="Nueva venta" [iconColor]="'var(--color-primary-text)'"
                [backgroundIcon]="'var(--color-primary-subtle-bg)'"
                descripcion="Registrar venta de vehiculo"></app-card-acceso-rapido>
            <app-card-acceso-rapido class="card-acceso" logo="build" titulo="Talleres" [iconColor]="'var(--color-accent-red)'"
                [backgroundIcon]="'var(--color-accent-red-bg)'" descripcion="Ver talleres"></app-card-acceso-rapido>
            <app-card-acceso-rapido class="card-acceso" logo="calendar_add_on" titulo="Clientes" [iconColor]="'var(--color-accent-green)'"
                [backgroundIcon]="'var(--color-accent-green-bg)'" descripcion="Ver clientes"></app-card-acceso-rapido>
        </div>
    </div>

</section>
